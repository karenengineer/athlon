name: Checks

on:
  pull_request:
  workflow_call:
    outputs:
      revision:
        description: Exact checked and verified commit
        value: ${{ jobs.verify.outputs.revision }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out event commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24 Action runtime
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact revision
        id: revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ && "$revision" == "$EXPECTED_REVISION" ]] || exit 1
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Set up application Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node24 Action runtime
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, Node24 Action runtime
        with:
          version: "11.19.0"
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify application including built production SSR
        run: pnpm verify
      - name: Verify shell and workflow contracts
        run: pnpm test:ops
      - name: Probe native Linux lock contention and release
        run: bash scripts/tests/native-flock.test.sh
      - name: Verify isolated actual PostgreSQL
        env:
          ATHLON_PG_INTEGRATION: "1"
        run: pnpm --filter @athlon/api test:e2e --testPathPatterns=catalog-postgres.e2e-spec
