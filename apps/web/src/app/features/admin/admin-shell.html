<div class="shell" [attr.lang]="i18n.locale()">
  <header>
    <a routerLink="/admin" class="brand"
      >ATHLON <span>{{ i18n.translate('admin') }}</span></a
    >
    <div class="actions">
      <label for="admin-language">{{ i18n.translate('language') }}</label>
      <select
        id="admin-language"
        [value]="i18n.locale()"
        (change)="i18n.setLocale($any($event.target).value)"
      >
        @for (locale of i18n.locales; track locale) {
        <option [value]="locale">{{ locale.toUpperCase() }}</option>
        }</select
      ><button type="button" (click)="logout()" [disabled]="leaving()">
        {{ i18n.translate('logout') }}
      </button>
    </div>
  </header>
  <nav class="primary-navigation" [attr.aria-label]="i18n.translate('admin')">
    @for (link of links; track link.path) {
    <a
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
      ariaCurrentWhenActive="page"
    >
      {{ i18n.translate(link.key) }}
    </a>
    }
    <section class="navigation-group">
      <button
        type="button"
        class="navigation-group-toggle"
        aria-controls="finance-navigation"
        [attr.aria-expanded]="financeOpen()"
        (click)="toggleFinance()"
      >
        <span>{{ i18n.translate('financeInventory') }}</span>
        <span aria-hidden="true">{{ financeOpen() ? '−' : '+' }}</span>
      </button>
      <div
        id="finance-navigation"
        class="navigation-group-links"
        [hidden]="!financeOpen()"
      >
        @for (link of financeLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
          ariaCurrentWhenActive="page"
        >
          {{ i18n.translate(link.key) }}
        </a>
        }
      </div>
    </section>
    <a class="public-site-link" [routerLink]="'/' + i18n.locale()">
      {{ i18n.translate('publicSite') }}
    </a>
  </nav>
  <main>
    @if (logoutFailed()) {
    <div role="alert">
      <p>{{ i18n.translate('logoutError') }}</p>
      <button type="button" (click)="logout()" [disabled]="leaving()">
        {{ i18n.translate('retry') }}
      </button>
    </div>
    }
    <router-outlet />
  </main>
</div>
