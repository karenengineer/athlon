<main class="login" [attr.lang]="i18n.locale()">
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
    <p class="brand">ATHLON</p>
    <h1>{{ i18n.translate('login') }}</h1>
    <label for="email">{{ i18n.translate('email') }}</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      required
    />
    <label for="password">{{ i18n.translate('password') }}</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      required
    />
    @if (failed()) {
    <p role="alert">{{ i18n.translate('loginError') }}</p>
    }
    <button type="submit" [disabled]="busy()">
      {{ i18n.translate(busy() ? 'loading' : 'login') }}
    </button>
    <label for="login-language">{{ i18n.translate('language') }}</label>
    <select
      id="login-language"
      [value]="i18n.locale()"
      (change)="i18n.setLocale($any($event.target).value)"
    >
      @for (locale of i18n.locales; track locale) {
      <option [value]="locale">{{ locale.toUpperCase() }}</option>
      }
    </select>
  </form>
</main>
